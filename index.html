<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的知识库</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <script src="lib/marked.min.js"></script>
  <link rel="stylesheet" href="lib/github-dark.min.css">
  <script src="lib/highlight.min.js"></script>
  <script src="data.js"></script>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-tertiary: #334155;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-light: rgba(59, 130, 246, 0.15);
      --border: #334155;
      --radius: 8px;
      --sidebar-width: 300px;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Monaco', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    ::selection { background: var(--accent); color: white; }

    /* Layout */
    .app { display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-width);
      height: 100vh;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 100;
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      padding: 1.25rem 1.25rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-title {
      font-size: 1.2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .sidebar-count {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    /* Search */
    .search-box {
      padding: 0.75rem 1rem;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.25rem;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-size: 0.85rem;
      font-family: var(--font-sans);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--text-muted); }

    .search-icon {
      position: absolute;
      left: 1.6rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Categories */
    .categories {
      padding: 0.25rem 0.5rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .category-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.45rem 0.6rem;
      background: none;
      border: none;
      border-radius: 6px;
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
    }

    .category-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .category-btn.active { background: var(--accent-light); color: var(--accent); }

    .category-count {
      margin-left: auto;
      font-size: 0.7rem;
      color: var(--text-muted);
      background: var(--bg-tertiary);
      padding: 0.1rem 0.45rem;
      border-radius: 10px;
    }

    /* Notes List */
    .notes-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .note-item {
      display: flex;
      flex-direction: column;
      width: 100%;
      padding: 0.65rem 0.75rem;
      background: none;
      border: none;
      border-radius: 6px;
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
      margin-bottom: 2px;
      border-left: 3px solid transparent;
    }

    .note-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .note-item.active { background: var(--accent-light); color: var(--text-primary); border-left-color: var(--accent); }

    .note-title { font-weight: 500; line-height: 1.4; }
    .note-date { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.2rem; }

    .note-tags { display: flex; gap: 0.3rem; margin-top: 0.3rem; flex-wrap: wrap; }

    .note-tag {
      font-size: 0.65rem;
      padding: 0.08rem 0.35rem;
      background: var(--bg-primary);
      border-radius: 4px;
      color: var(--text-muted);
    }

    .notes-empty { padding: 2rem 1rem; text-align: center; color: var(--text-muted); font-size: 0.85rem; }

    /* Main Content */
    .main {
      margin-left: var(--sidebar-width);
      flex: 1;
      min-height: 100vh;
    }

    .content-wrapper {
      max-width: 900px;
      margin: 0 auto;
      padding: 2.5rem 3rem;
    }

    /* Menu Button (Mobile) */
    .menu-btn {
      display: none;
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 90;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      padding: 0.5rem;
      cursor: pointer;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 99;
    }

    /* Note Header */
    .note-header {
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .note-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 0.75rem;
    }

    .note-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 0.75rem; }
    .note-meta-date { font-size: 0.85rem; color: var(--text-muted); }
    .note-meta-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; }

    .meta-tag {
      font-size: 0.72rem;
      padding: 0.15rem 0.55rem;
      background: var(--accent-light);
      color: var(--accent);
      border-radius: 12px;
      font-weight: 500;
    }

    /* Placeholder */
    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      color: var(--text-muted);
    }

    .placeholder-icon { font-size: 4rem; margin-bottom: 1rem; }
    .placeholder h2 { font-size: 1.5rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.5rem; }
    .placeholder p { font-size: 1rem; }

    /* Markdown Content */
    .markdown-body { font-size: 1rem; line-height: 1.8; }
    .markdown-body h1 { font-size: 1.75rem; font-weight: 700; margin: 2rem 0 1rem; padding-bottom: 0.4rem; border-bottom: 2px solid var(--border); }
    .markdown-body h2 { font-size: 1.4rem; font-weight: 600; margin: 2.5rem 0 1rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--border); }
    .markdown-body h3 { font-size: 1.15rem; font-weight: 600; margin: 1.75rem 0 0.75rem; }
    .markdown-body h4 { font-size: 1.05rem; font-weight: 600; margin: 1.5rem 0 0.5rem; color: var(--text-secondary); }
    .markdown-body p { margin: 0.75rem 0; }
    .markdown-body strong { font-weight: 600; }
    .markdown-body em { color: var(--text-secondary); }
    .markdown-body ul, .markdown-body ol { margin: 0.75rem 0; padding-left: 1.5rem; }
    .markdown-body li { margin: 0.3rem 0; }
    .markdown-body li::marker { color: var(--accent); }

    .markdown-body blockquote {
      margin: 1.25rem 0;
      padding: 0.85rem 1.25rem;
      border-left: 4px solid var(--accent);
      background: var(--accent-light);
      border-radius: 0 var(--radius) var(--radius) 0;
      color: var(--text-secondary);
    }

    .markdown-body code {
      font-family: var(--font-mono);
      font-size: 0.875em;
      padding: 0.15em 0.4em;
      background: var(--bg-tertiary);
      border-radius: 4px;
    }

    .markdown-body pre {
      margin: 1.25rem 0;
      padding: 1.25rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
    }

    .markdown-body pre code { padding: 0; background: transparent; font-size: 0.85rem; line-height: 1.6; }

    .markdown-body table { width: 100%; margin: 1.25rem 0; border-collapse: collapse; font-size: 0.88rem; }
    .markdown-body th { background: var(--bg-tertiary); font-weight: 600; padding: 0.65rem 0.85rem; border: 1px solid var(--border); text-align: left; }
    .markdown-body td { padding: 0.6rem 0.85rem; border: 1px solid var(--border); }
    .markdown-body tr:nth-child(even) { background: var(--bg-secondary); }
    .markdown-body hr { margin: 2rem 0; border: none; border-top: 1px solid var(--border); }
    .markdown-body a { color: var(--accent); text-decoration: none; }
    .markdown-body a:hover { text-decoration: underline; }

    /* Loading */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem;
      gap: 1rem;
      color: var(--text-muted);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); width: 85vw; max-width: 300px; }
      .sidebar.open { transform: translateX(0); }
      .sidebar.open ~ .overlay { display: block; }
      .main { margin-left: 0; }
      .content-wrapper { padding: 1rem 1.25rem; padding-top: 4rem; }
      .menu-btn { display: flex; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <span>📚</span>
          <span>我的知识库</span>
        </div>
        <span class="sidebar-count" id="notesCount">0 篇笔记</span>
      </div>

      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8" />
          <path d="M21 21l-4.35-4.35" />
        </svg>
        <input type="text" class="search-input" id="searchInput" placeholder="搜索笔记...">
      </div>

      <div class="categories" id="categories"></div>
      <div class="notes-list" id="notesList"></div>
    </aside>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- Main Content -->
    <main class="main">
      <button class="menu-btn" onclick="toggleSidebar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
          <path d="M3 12h18M3 6h18M3 18h18" />
        </svg>
      </button>
      <div class="content-wrapper" id="content"></div>
    </main>
  </div>

  <script>
    // State
    let selectedNote = null;
    let searchQuery = '';
    let selectedCategory = null;

    // Configure marked
    marked.use({
      breaks: true,
      gfm: true
    });

    // Initialize
    function init() {
      document.getElementById('notesCount').textContent = NOTES.length + ' 篇笔记';
      renderCategories();
      renderNotesList();
      renderPlaceholder();

      document.getElementById('searchInput').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderNotesList();
      });
    }

    // Render categories
    function renderCategories() {
      const container = document.getElementById('categories');
      let html = `
        <button class="category-btn ${!selectedCategory ? 'active' : ''}" onclick="selectCategory(null)">
          <span>📋</span>
          <span>全部</span>
          <span class="category-count">${NOTES.length}</span>
        </button>
      `;

      CATEGORIES.forEach(cat => {
        const count = NOTES.filter(n => n.category === cat.id).length;
        if (count === 0) return;
        html += `
          <button class="category-btn ${selectedCategory === cat.id ? 'active' : ''}" onclick="selectCategory('${cat.id}')">
            <span>${cat.icon}</span>
            <span>${cat.name}</span>
            <span class="category-count">${count}</span>
          </button>
        `;
      });

      container.innerHTML = html;
    }

    // Render notes list
    function renderNotesList() {
      const container = document.getElementById('notesList');
      const filtered = NOTES.filter(note => {
        const matchesSearch = !searchQuery ||
          note.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          (note.tags && note.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()))) ||
          (note.summary && note.summary.toLowerCase().includes(searchQuery.toLowerCase()));
        const matchesCategory = !selectedCategory || note.category === selectedCategory;
        return matchesSearch && matchesCategory;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="notes-empty">没有找到匹配的笔记</div>';
        return;
      }

      container.innerHTML = filtered.map(note => `
        <button class="note-item ${selectedNote && selectedNote.id === note.id ? 'active' : ''}" onclick="selectNote('${note.id}')">
          <span class="note-title">${note.title}</span>
          <span class="note-date">${note.date}</span>
          ${note.tags ? `<div class="note-tags">${note.tags.slice(0, 3).map(t => `<span class="note-tag">${t}</span>`).join('')}</div>` : ''}
        </button>
      `).join('');
    }

    // Select category
    function selectCategory(id) {
      selectedCategory = selectedCategory === id ? null : id;
      renderCategories();
      renderNotesList();
    }

    // Select note
    function selectNote(id) {
      selectedNote = NOTES.find(n => n.id === id);
      renderNotesList();
      loadNoteContent();
      toggleSidebar(false);
    }

    // Load note content
    function loadNoteContent() {
      const container = document.getElementById('content');
      if (!selectedNote) {
        renderPlaceholder();
        return;
      }

      container.innerHTML = '<div class="loading"><div class="spinner"></div><span>加载中...</span></div>';

      fetch(selectedNote.file)
        .then(res => res.text())
        .then(markdown => {
          const html = `
            <div class="note-header">
              <h1>${selectedNote.title}</h1>
              <div class="note-meta">
                <span class="note-meta-date">📅 ${selectedNote.date}</span>
                ${selectedNote.tags ? `<div class="note-meta-tags">${selectedNote.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>` : ''}
              </div>
            </div>
            <article class="markdown-body">${marked.parse(markdown)}</article>
          `;
          container.innerHTML = html;
          document.querySelectorAll('pre code').forEach(block => {
            hljs.highlightElement(block);
          });
          window.scrollTo(0, 0);
        })
        .catch(err => {
          container.innerHTML = `
            <div class="note-header">
              <h1>${selectedNote.title}</h1>
            </div>
            <div class="markdown-body"><p>无法加载笔记内容: ${err.message}</p></div>
          `;
        });
    }

    // Render placeholder
    function renderPlaceholder() {
      document.getElementById('content').innerHTML = `
        <div class="placeholder">
          <span class="placeholder-icon">📚</span>
          <h2>欢迎来到我的知识库</h2>
          <p>从左侧选择一篇笔记开始阅读</p>
        </div>
      `;
    }

    // Toggle sidebar (mobile)
    function toggleSidebar(forceState) {
      const sidebar = document.getElementById('sidebar');
      const isOpen = sidebar.classList.contains('open');
      const newState = forceState !== undefined ? forceState : !isOpen;
      sidebar.classList.toggle('open', newState);
    }

    // Start
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
